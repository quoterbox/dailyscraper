[project]
name = "dailyscraper"
version = "0.1.0a1"
description = "Web scraping framework with one interface for browser (Playwright) and HTTP scraping, JSON-defined scrapers and proxy rotation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md", "THIRD_PARTY_LICENSES"]
requires-python = ">=3.13"
authors = [{ name = "JQ" }]
keywords = [
    "scraping", "web-scraping", "scraper", "scraping-framework", "crawler",
    "data-extraction", "playwright", "http", "xpath", "proxy-rotation",
    "parallel", "ecommerce",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "openpyxl>=3.1",
    "playwright==1.59.0",
    "psutil>=6",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://dailyscraper.com/"
Source = "https://github.com/quoterbox/dailyscraper"
Issues = "https://github.com/quoterbox/dailyscraper/issues"

[project.scripts]
dailyscraper = "dailyscraper.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dailyscraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-p", "tests.bootstrap",
    "--strict-markers",
    "-m", "not network and not browser and not external and not soak",
]
xfail_strict = true
markers = [
    "network: opt-in checks against the controlled site https://dailyscraper.com/tests/",
    "browser: opt-in browser acceptance against the controlled site",
    "external: opt-in Ozon/WB canaries with non-deterministic content",
    "soak: opt-in long-running stability and resource tests",
    "serial: scenario owns process/browser resources and must not be parallelized",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Python sources only: ruff must never rewrite JSON configs, scraper packages or Markdown.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dailyscraper", "tests"]
