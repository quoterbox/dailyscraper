name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches project version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv build
      - run: uv publish --check-url https://pypi.org/simple/
